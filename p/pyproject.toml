[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygorvid"
version = "0.1.0"
description = "Video file support library to reduce dependency on ffmpeg"
requires-python = ">=3.9"

[project.scripts]
vidprobe = "pygorvid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
