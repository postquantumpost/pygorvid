[package]
name = "pygorvid"
version = "1.0.0"
edition = "2021"
description = "Video file support library to reduce dependency on ffmpeg"
license = "MIT"
repository = "https://github.com/postquantumpost/pygorvid"

[lib]
name = "pygorvid"
path = "src/lib.rs"

[[bin]]
name = "vidprobe"
path = "src/bin/vidprobe.rs"

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
